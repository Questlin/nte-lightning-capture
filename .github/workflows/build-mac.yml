name: Build Mac app

on:
  push:
    # Each push to mac-test publishes a Mac-only pre-release (tag mac-test-N);
    # v* tags attach the Mac zip to the regular release.
    branches: [main, mac-test]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Apple Silicon runner: NTE's Mac client only runs on Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build app
        run: ./build_mac.sh --no-tests

      - name: Check the built app starts and has its modules
        run: |
          "dist/NTE Lightning Capture.app/Contents/MacOS/NTE Lightning Capture" --self-test selftest.txt || status=$?
          cat selftest.txt
          exit ${status:-0}

      - uses: actions/upload-artifact@v4
        with:
          name: NTELightningCapture-mac
          path: dist/NTELightningCapture-mac.zip

  release:
    # Only release builds get write access, to attach the zip to a release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/mac-test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v4
        with:
          name: NTELightningCapture-mac

      - name: Write checksum
        run: sha256sum NTELightningCapture-mac.zip > NTELightningCapture-mac.zip.sha256

      - uses: softprops/action-gh-release@v2
        with:
          # On mac-test the release (and its tag) is created here, at this commit.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('mac-test-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Mac test build {0}', github.run_number) }}
          body_path: ${{ github.ref_type != 'tag' && '.github/mac-test-release.md' || '' }}
          files: |
            NTELightningCapture-mac.zip
            NTELightningCapture-mac.zip.sha256
