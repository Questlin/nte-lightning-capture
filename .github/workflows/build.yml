name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --uac-admin --name NTELightningCapture
          --collect-submodules dxcam --collect-submodules comtypes run_app.py

      - name: Check the built exe starts and has its modules
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\NTELightningCapture.exe -ArgumentList "--self-test", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: NTELightningCapture
          path: dist/NTELightningCapture.exe

  release:
    # Only tag builds get write access, to attach the .exe to a release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NTELightningCapture

      - name: Write checksum
        run: sha256sum NTELightningCapture.exe > NTELightningCapture.exe.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            NTELightningCapture.exe
            NTELightningCapture.exe.sha256
